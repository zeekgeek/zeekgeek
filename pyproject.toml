[project]
name = "zeekgeek-bluetooth-radar"
version = "0.1.0"
description = "Local Bluetooth proximity radar with live visualization and anomaly heuristics."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bleak",
    "fastapi",
    "uvicorn[standard]",
]

[project.scripts]
bt-radar = "bt_radar.__main__:main"
bt-thrust = "bt_thrust.__main__:main"
wifi-radar = "wifi_radar.__main__:main"
mac-battery = "mac_battery.__main__:main"
jet-radar = "jet_radar.__main__:main"
shield-line = "shield_line.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"bt_radar" = ["data/*.json"]
"bt_thrust" = ["data/*.json"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
