# Autopilot configuration — edit niches and schedule here

# Niches rotate in order each cycle (add your test winners here)
niches:
  - retro cat shirt
  - cottagecore mushroom shirt
  - funny pickle lover shirt
  - book lover stack shirt
  - retro bowling shirt

# How long to sleep between full pipeline cycles (seconds)
cycle_interval_seconds: 21600  # 6 hours

# Safety caps — keep new shops under Etsy's spam radar
max_cycles_per_day: 4
concepts_per_cycle: 5
max_results_per_scrape: 24

# Use demo scraper (true = offline, no Etsy HTTP). Set false on your Mac for live trends.
demo: true

# Optional: set via environment variable ANTHROPIC_API_KEY for smarter copy
use_claude: false

# Human gate — autopilot never auto-uploads; you approve then upload manually
require_manual_upload: true
daily_upload_cap: 5
